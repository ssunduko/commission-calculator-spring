# AI profile — MCP server in Streamable HTTP mode (not STDIO)
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.protocol=STREAMABLE

# ============================================================
# OBSERVABILITY — AI module specifics
# ============================================================
# Loki push endpoint (HTTP). Override LOKI_URL when running outside
# the docker-compose observability stack.
app.loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

# Tag the AI module so logs/metrics/traces from this profile can be
# filtered separately from the verticalslice/orm/springboot apps.
management.observations.key-values.module=ai
management.metrics.tags.module=ai
