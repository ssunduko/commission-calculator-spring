# ============================================================================
# DEVELOPMENT PROFILE CONFIGURATION — application-dev.properties
# ============================================================================
#
# CONCEPT: Application Profiles & Externalized Configuration
# ------------------------------------------------------------
# Spring Boot profiles allow you to have different configurations for different
# environments (development, testing, staging, production).
#
# HOW TO ACTIVATE A PROFILE:
#   1. Command line:  java -jar app.jar --spring.profiles.active=dev
#   2. Environment variable: SPRING_PROFILES_ACTIVE=dev
#   3. application.properties: spring.profiles.active=dev
#   4. IDE run configuration: Add --spring.profiles.active=dev
#
# PROPERTY RESOLUTION ORDER (highest priority first):
#   1. Command-line arguments (--server.port=9090)
#   2. Environment variables (SERVER_PORT=9090)
#   3. application-{profile}.properties (this file)
#   4. application.properties (base config)
#   5. @PropertySource annotations
#   6. Default properties (SpringApplication.setDefaultProperties())
#
# This means profile-specific properties OVERRIDE base properties.
# For example, server.port=8082 here overrides server.port=8081 in
# application.properties when the "dev" profile is active.

# Development server port (different from default to avoid conflicts)
server.port=8082

# Enable DevTools features
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Disable Thymeleaf caching so template changes are reflected immediately
spring.thymeleaf.cache=false

# Show detailed errors in development
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Enable verbose logging for Spring framework
logging.level.com.chapman.edu.commissions.springboot=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT settings for development (shorter expiration for testing)
app.jwt.secret=DevSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS256Algorithm
app.jwt.expirationMs=3600000

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true
