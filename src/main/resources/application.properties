spring.application.name=commission-calculator
spring.docker.compose.enabled=false
spring.main.allow-bean-definition-overriding=true

# Security credentials
spring.security.user.name=admin
spring.security.user.password=admin123

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:commissiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Management endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Server Configuration
server.port=8081

# MCP Server Configuration
spring.ai.mcp.server.name=commission-calculator
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.protocol=SSE

# MCP STDIO Configuration (for Claude Desktop)
# STDIO is disabled by default - enable it via command line args for Claude Desktop
# The Claude Desktop config uses: -Dspring.ai.mcp.server.stdio=true
spring.ai.mcp.server.stdio=false

# ============================================================
# ORM MODULE CONFIGURATION
# ============================================================

# Flyway Database Migration Configuration
# Flyway manages database schema versioning and migrations.
# Migration scripts are located in src/main/resources/db/migration/
# Naming convention: V{version}__{description}.sql (e.g., V1__create_tables.sql)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# When Flyway manages schema, disable Hibernate auto-DDL
# In production, ALWAYS use Flyway (not ddl-auto) for schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

# Spring Cache Configuration
# Enables the @Cacheable, @CacheEvict, @CachePut annotations
spring.cache.type=simple
spring.cache.cache-names=commissionPlans,deals,users,calculations

# JPA/Hibernate Additional Settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Banner and logging
spring.main.banner-mode=console