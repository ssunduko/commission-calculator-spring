name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - name: Run all tests
        run: ./mvnw test -B
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: dorny/test-reporter@v1
        if: always()
        with: { name: 'Test Results', path: 'target/surefire-reports/*.xml', reporter: 'java-junit' }

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - name: Run JaCoCo, Checkstyle, and SpotBugs
        run: ./mvnw verify -B -DskipTests
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: codecov/codecov-action@v4
        with: { file: 'target/site/jacoco/jacoco.xml' }

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Run OWASP Dependency-Check
        run: ./mvnw dependency-check:check -B
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - uses: github/codeql-action/init@v3
        with: { languages: 'java' }
      - name: Compile for CodeQL analysis
        run: ./mvnw compile -B -DskipTests
      - uses: github/codeql-action/analyze@v3

  smoke-test:
    name: Vertical Slice Smoke Test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }

      - name: Build application
        run: ./mvnw package -B -DskipTests -Pverticalslice
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Start application
        run: |
          AUTH_PASS="${SPRING_SECURITY_PASSWORD:-admin123}"
          echo "AUTH_PASS=$AUTH_PASS" >> "$GITHUB_ENV"
          ./mvnw spring-boot:run -B -Pverticalslice &
          echo "Waiting for application to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "Application started successfully"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          curl -s http://localhost:8081/actuator/health || (echo "Application failed to start" && exit 1)
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify API docs available
        run: |
          echo "=== Checking Swagger/OpenAPI docs ==="
          curl -s --fail-with-body http://localhost:8081/api-docs | jq '.info'

      - name: Create commission plan
        id: create-plan
        run: |
          echo "=== Creating Commission Plan ==="
          PLAN=$(curl -s --fail-with-body -X POST http://localhost:8081/api/plans \
            -u "admin:${AUTH_PASS}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Standard Plan",
              "currencyCode": "USD",
              "effectiveStartDate": "2026-01-01"
            }')
          echo "$PLAN" | jq .
          PLAN_ID=$(echo "$PLAN" | jq -r '.id')
          echo "plan_id=$PLAN_ID" >> "$GITHUB_OUTPUT"

      - name: Activate commission plan
        run: |
          echo "=== Activating Plan ==="
          curl -s --fail-with-body -X POST "http://localhost:8081/api/plans/${{ steps.create-plan.outputs.plan_id }}/activate" \
            -u "admin:${AUTH_PASS}" | jq .

      - name: Create deal
        id: create-deal
        run: |
          echo "=== Creating Deal ==="
          HTTP_CODE=$(curl -s -o /tmp/deal_response.json -w "%{http_code}" -X POST http://localhost:8081/api/deals \
            -u "admin:${AUTH_PASS}" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "CI Smoke Test Deal",
              "value": 100000,
              "salesRepId": "usr-001"
            }')
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/deal_response.json | jq . || cat /tmp/deal_response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Deal creation failed with HTTP $HTTP_CODE"
            exit 1
          fi
          DEAL_ID=$(jq -r '.id' /tmp/deal_response.json)
          echo "deal_id=$DEAL_ID" >> "$GITHUB_OUTPUT"

      - name: Calculate commission
        run: |
          echo "=== Calculating Commission ==="
          CALC=$(curl -s --fail-with-body -X POST http://localhost:8081/api/calculations \
            -u "admin:${AUTH_PASS}" \
            -H "Content-Type: application/json" \
            -d "{
              \"dealId\": \"${{ steps.create-deal.outputs.deal_id }}\",
              \"planId\": \"${{ steps.create-plan.outputs.plan_id }}\"
            }")
          echo "$CALC" | jq .

      - name: Verify all data via GET endpoints
        run: |
          echo "=== All Commission Plans ==="
          curl -s --fail-with-body "http://localhost:8081/api/plans" \
            -u "admin:${AUTH_PASS}" | jq .

          echo "=== All Deals ==="
          curl -s --fail-with-body "http://localhost:8081/api/deals" \
            -u "admin:${AUTH_PASS}" | jq .

          echo "=== All Calculations ==="
          curl -s --fail-with-body "http://localhost:8081/api/calculations" \
            -u "admin:${AUTH_PASS}" | jq .

      - name: Verify MCP server is running
        run: |
          echo "=== MCP Tools List ==="
          curl -s --fail-with-body -X POST http://localhost:8081/api/mcp/tools/list | jq '.tools | length'
          echo "MCP server verified with registered tools"

  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [tests, smoke-test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Scrub hardcoded Anthropic API key from properties
        # application.properties has historically shipped a ${ANTHROPIC_API_KEY:sk-ant-...}
        # fallback that bakes a real key into the jar. Replace any such literal
        # fallback with an empty default so runtime env vars are the only source.
        run: |
          sed -i -E 's|\$\{ANTHROPIC_API_KEY:sk-ant-[^}]*\}|\$\{ANTHROPIC_API_KEY:\}|g' \
            src/main/resources/application.properties

      - name: Fail if any Anthropic key literal remains in sources
        run: |
          if grep -rEn "sk-ant-[A-Za-z0-9_-]+" src/ 2>/dev/null; then
            echo "::error::Anthropic API key literal found in sources — refusing to build image"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/commission-calculator" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}

      - name: Verify pushed image contains no Anthropic key
        run: |
          docker pull ${{ steps.img.outputs.name }}:${{ github.sha }}
          CID=$(docker create ${{ steps.img.outputs.name }}:${{ github.sha }})
          docker cp "$CID":/app/app.jar /tmp/app.jar
          docker rm "$CID" > /dev/null
          if unzip -p /tmp/app.jar BOOT-INF/classes/application.properties | grep -E "sk-ant-[A-Za-z0-9_-]+"; then
            echo "::error::Anthropic API key leaked into pushed image"
            exit 1
          fi
          echo "Image verified clean: no sk-ant-* literal in packaged properties"
