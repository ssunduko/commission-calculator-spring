# ============================================================
# TOGGLZ — Feature Flags (verticalslice profile only)
# ============================================================
togglz.enabled=true
togglz.feature-enums=com.chapman.edu.commissions.architecture.verticalslice.infrastructure.config.Features
togglz.console.enabled=true
togglz.console.path=/togglz-console
togglz.console.secured=false

# ============================================================
# A2A (AGENT-TO-AGENT) — DISPUTE FILING AGENT
# ============================================================
# Enabled here rather than in shared application.properties so the other
# architecture modules' test contexts don't attempt to load the A2A
# autoconfigure (they don't provide an AgentCard bean).
spring.ai.a2a.server.enabled=true
