# ============================================================================
# PRODUCTION PROFILE CONFIGURATION — application-prod.properties
# ============================================================================
#
# CONCEPT: Production Configuration Best Practices
# ---------------------------------------------------
# Production configuration prioritizes:
#   - Security: Stronger secrets, disabled debug endpoints
#   - Performance: Template caching enabled, minimal logging
#   - Safety: No stack traces in error responses, no H2 console
#
# CONCEPT: Externalized Configuration
# --------------------------------------
# In production, sensitive values (secrets, passwords, API keys) should NOT
# be hardcoded in properties files. Instead, use:
#   1. Environment variables: APP_JWT_SECRET=myProductionSecret
#   2. Spring Cloud Config Server (centralized configuration)
#   3. HashiCorp Vault (secrets management)
#   4. AWS Systems Manager Parameter Store
#   5. Kubernetes ConfigMaps and Secrets

# Production server port
server.port=8080

# Disable DevTools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Enable template caching for performance
spring.thymeleaf.cache=true

# Hide error details from clients (security best practice)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Minimal logging in production
logging.level.com.chapman.edu.commissions.springboot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Disable H2 console in production (security)
spring.h2.console.enabled=false

# JWT settings for production (longer expiration, strong secret)
# In production, this should come from an environment variable:
#   export APP_JWT_SECRET=your-very-long-and-random-production-secret-key
app.jwt.secret=${APP_JWT_SECRET:ProductionSecretKeyMustBeSetViaEnvironmentVariable123}
app.jwt.expirationMs=86400000

# Disable pretty-printing for smaller response payloads
spring.jackson.serialization.indent-output=false

# Enable GZIP compression for responses
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
