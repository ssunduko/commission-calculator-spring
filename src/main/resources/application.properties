spring.application.name=commission-calculator
spring.docker.compose.enabled=false
spring.main.allow-bean-definition-overriding=true

# Security credentials
spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin123}

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:commissiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# OBSERVABILITY — Spring Boot Actuator
# ============================================================
# Expose health/info plus the endpoints needed by Prometheus
# (prometheus), the Grafana metrics explorer (metrics), and ops
# (env, loggers, threaddump, heapdump). Trim this list in prod.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,threaddump,heapdump,mappings
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Tag every metric and trace with the application name + module so
# Prometheus/Grafana/Jaeger can filter when multiple services share a stack.
management.observations.key-values.application=${spring.application.name}
management.metrics.tags.application=${spring.application.name}

# Histogram buckets for HTTP server timings — enables percentile queries
# in Grafana (e.g. http_server_requests_seconds_bucket{le="0.5"}).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Distributed tracing — Micrometer Tracing → OpenTelemetry → OTLP.
# Sampling probability is 1.0 in dev so every request shows up in
# Jaeger; lower this in production (0.1 = 10%).
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C

# OTLP exporter — points at the Jaeger all-in-one OTLP receiver
# (port 4318 = OTLP/HTTP, 4317 = OTLP/gRPC). Override OTLP_ENDPOINT
# to send to a different collector.
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.transport=http

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Server Configuration
server.port=8081

# MCP Server Configuration
spring.ai.mcp.server.name=commission-calculator
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.annotation-scanner.enabled=true

# MCP STDIO Configuration (for Claude Desktop STDIO mode)
# Leave false so the Streamable HTTP transport at /mcp stays registered.
# Flip to true (plus -Dspring.ai.mcp.server.protocol=STDIO) only when running
# as a stdio subprocess from an MCP client that spawns you directly.
spring.ai.mcp.server.stdio=false

# MCP Client Configuration — External Currency Conversion Server
# Uses the Streamable HTTP transport (the legacy /sse endpoint returns 404).
app.mcp.currency.base-url=https://currency-mcp.wesbos.com
app.mcp.currency.mcp-endpoint=/mcp

# ============================================================
# ORM MODULE CONFIGURATION
# ============================================================

# Flyway Database Migration Configuration
# Flyway manages database schema versioning and migrations.
# Migration scripts are located in src/main/resources/db/migration/
# Naming convention: V{version}__{description}.sql (e.g., V1__create_tables.sql)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# When Flyway manages schema, disable Hibernate auto-DDL
# In production, ALWAYS use Flyway (not ddl-auto) for schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

# Spring Cache Configuration
# Enables the @Cacheable, @CacheEvict, @CachePut annotations
spring.cache.type=simple
spring.cache.cache-names=commissionPlans,deals,users,calculations

# JPA/Hibernate Additional Settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false

# Banner and logging
spring.main.banner-mode=console

# ============================================================
# SPRING AI MODULE CONFIGURATION
# ============================================================
#
# CONCEPT: AI Model Configuration
# Spring AI uses properties to configure AI model connections.
# These properties are read by auto-configuration classes that
# create ChatModel and EmbeddingModel beans.

# Anthropic Claude API Configuration
# The API key authenticates requests to Anthropic's Claude API.
# SECURITY: In production, use environment variables or a secrets manager.
# Set via environment variable: SPRING_AI_ANTHROPIC_API_KEY=your-key

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# Model Selection: Claude Sonnet 4 (high capability)
# Available models: claude-sonnet-4-20250514, claude-haiku-4-5-20251001
# Sonnet 4 balances intelligence and speed for production use.

spring.ai.anthropic.chat.options.model=claude-sonnet-4-20250514

# Max Tokens: Maximum number of tokens in the AI's response
# 1 token ≈ 4 characters. 1024 tokens ≈ 750 words.
spring.ai.anthropic.chat.options.max-tokens=1024

# Temperature: Controls randomness/creativity (0.0 to 1.0)
# 0.0 = Deterministic (same input → same output)
# 0.7 = Balanced (good for general use)
# 1.0 = Maximum creativity (good for brainstorming)
# For commission analysis, we use 0.3 for consistency.
spring.ai.anthropic.chat.options.temperature=0.3

# ============================================================
# A2A (AGENT-TO-AGENT) — DISPUTE FILING AGENT
# ============================================================
# Spring AI's A2A server autoconfigure defaults ON (matchIfMissing=true), but
# it requires AgentCard + AgentExecutor beans — which we only provide when the
# dispute-filing agent is wanted. Default off here so startup is safe without
# an Anthropic API key / ChatClient.Builder.
#
# When enabled, exposes:
#   GET /.well-known/agent-card.json  (discovery)
#   POST /                            (JSON-RPC sendMessage)
#
# MUST stay false in shared properties: other modules (microservice,
# orthogonal, orm, springboot) do NOT provide the required AgentCard bean,
# so their test contexts fail with UnsatisfiedDependencyException on
# A2AServerAutoConfiguration.logAgentCard when the flag is true.
# The verticalslice profile (application-verticalslice.properties) flips
# this to true for the production app.
spring.ai.a2a.server.enabled=false
a2a.dispute-agent.url=http://localhost:8081

# ============================================================
# VECTOR STORE PERSISTENCE
# ============================================================
# File path for SimpleVectorStore persistence.
# On startup, if this file exists, embeddings are loaded from disk
# instead of being recomputed — significantly faster restarts.
# The file is saved automatically after documents are loaded.
app.vectorstore.file-path=data/vectorstore.json

# ============================================================
# TOGGLZ — Feature Flags (disabled by default; enabled via verticalslice profile)
# ============================================================
togglz.enabled=false