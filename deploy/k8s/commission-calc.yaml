apiVersion: v1
kind: Namespace
metadata:
  name: commission-calc
---
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-key
  namespace: commission-calc
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-REPLACE-ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commission-calc
  namespace: commission-calc
spec:
  replicas: 1
  selector:
    matchLabels: { app: commission-calc }
  template:
    metadata:
      labels: { app: commission-calc }
    spec:
      containers:
        - name: app
          image: ssunduko/commission-calculator:latest
          imagePullPolicy: IfNotPresent
          # Combined image: Spring Boot serves the API on 8081 and the UI as
          # static resources on the same port. If your image actually splits
          # the UI on 3000, add it here and to the Service below.
          ports:
            - containerPort: 8081
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-key
                  key: ANTHROPIC_API_KEY
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits:   { cpu: "1000m", memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: commission-calc
  namespace: commission-calc
spec:
  type: NodePort
  selector: { app: commission-calc }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30808
