name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - run: ./mvnw test -B
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: dorny/test-reporter@v1
        if: always()
        with: { name: 'Unit Tests', path: 'target/surefire-reports/*.xml', reporter: 'java-junit' }

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - run: ./mvnw verify -B -DskipTests
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: codecov/codecov-action@v4
        with: { file: 'target/site/jacoco/jacoco.xml' }

  security-scan:
    runs-on: ubuntu-latest
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - uses: github/codeql-action/init@v3
        with: { languages: 'java' }
      - run: ./mvnw compile -B -DskipTests
      - uses: github/codeql-action/analyze@v3

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }
      - name: Run Spring Boot E2E integration tests
        run: ./mvnw test -B -Dtest="com.chapman.edu.commissions.springboot.integration.**"
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: dorny/test-reporter@v1
        if: always()
        with: { name: 'E2E Tests', path: 'target/surefire-reports/*.xml', reporter: 'java-junit' }

  verticalslice-smoke-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', cache: 'maven' }

      - name: Build application
        run: ./mvnw package -B -DskipTests -Pverticalslice
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Start verticalslice application
        run: |
          ./mvnw spring-boot:run -B -Pverticalslice &
          echo "Waiting for application to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "Application started successfully"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 5
          done
          curl -sf http://localhost:8081/actuator/health || (echo "Application failed to start" && exit 1)
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify API docs available
        run: |
          echo "=== Checking Swagger/OpenAPI docs ==="
          curl -sf http://localhost:8081/api-docs | jq '.info'

      - name: Create commission plan
        id: create-plan
        run: |
          echo "=== Creating Commission Plan ==="
          PLAN=$(curl -sf -X POST http://localhost:8081/api/plans \
            -u admin:${{ secrets.SPRING_SECURITY_PASSWORD || 'admin123' }} \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Standard Plan",
              "currencyCode": "USD",
              "effectiveStartDate": "2026-01-01"
            }')
          echo "$PLAN" | jq .
          PLAN_ID=$(echo "$PLAN" | jq -r '.id')
          echo "plan_id=$PLAN_ID" >> "$GITHUB_OUTPUT"

      - name: Activate commission plan
        run: |
          echo "=== Activating Plan ==="
          curl -sf -X POST http://localhost:8081/api/plans/${{ steps.create-plan.outputs.plan_id }}/activate \
            -u admin:${{ secrets.SPRING_SECURITY_PASSWORD || 'admin123' }} | jq .

      - name: Create deal
        id: create-deal
        run: |
          echo "=== Creating Deal ==="
          DEAL=$(curl -sf -X POST http://localhost:8081/api/deals \
            -u admin:${{ secrets.SPRING_SECURITY_PASSWORD || 'admin123' }} \
            -H "Content-Type: application/json" \
            -d '{
              "title": "CI Smoke Test Deal",
              "value": 100000,
              "salesRepId": "smoke-test-rep"
            }')
          echo "$DEAL" | jq .
          DEAL_ID=$(echo "$DEAL" | jq -r '.id')
          echo "deal_id=$DEAL_ID" >> "$GITHUB_OUTPUT"

      - name: Calculate commission
        run: |
          echo "=== Calculating Commission ==="
          CALC=$(curl -sf -X POST http://localhost:8081/api/calculations \
            -u admin:${{ secrets.SPRING_SECURITY_PASSWORD || 'admin123' }} \
            -H "Content-Type: application/json" \
            -d '{
              "dealId": "${{ steps.create-deal.outputs.deal_id }}",
              "planId": "${{ steps.create-plan.outputs.plan_id }}"
            }')
          echo "$CALC" | jq .

      - name: Verify all data via GET endpoints
        run: |
          echo "=== All Commission Plans ==="
          curl -sf http://localhost:8081/api/plans \
            -u admin:${{ secrets.SPRING_SECURITY_PASSWORD || 'admin123' }} | jq .

          echo "=== All Deals ==="
          curl -sf http://localhost:8081/api/deals \
            -u admin:${{ secrets.SPRING_SECURITY_PASSWORD || 'admin123' }} | jq .

          echo "=== All Calculations ==="
          curl -sf http://localhost:8081/api/calculations \
            -u admin:${{ secrets.SPRING_SECURITY_PASSWORD || 'admin123' }} | jq .

      - name: Verify MCP server is running
        run: |
          echo "=== MCP Tools List ==="
          curl -sf -X POST http://localhost:8081/api/mcp/tools/list | jq '.tools | length'
          echo "MCP server verified with registered tools"
